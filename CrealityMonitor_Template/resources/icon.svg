<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- iCUE tints this icon itself (grey / black-on-white) and only uses its shape, so: no background
       rectangle, one flat colour, solid shapes with clear gaps so it still reads at ~24px. -->
  <g fill="#ffffff">
    <!-- gantry rail -->
    <rect x="6" y="6" width="52" height="9" rx="4.5"/>
    <!-- extruder hanging from the rail -->
    <rect x="25" y="14" width="14" height="15" rx="3"/>
    <!-- nozzle tip -->
    <path d="M27.5 31 L36.5 31 L32 39 Z"/>
    <!-- printed object, layer by layer -->
    <rect x="19" y="42" width="26" height="6" rx="2"/>
    <rect x="9" y="50" width="46" height="8" rx="3"/>
  </g>
</svg>
